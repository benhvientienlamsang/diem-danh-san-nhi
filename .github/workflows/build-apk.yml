# Build app Android "Điểm danh" – Từ BV TLS – by Dr Huy - BV TLS
name: Build APK Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cài thư viện
        run: npm ci

      - name: Chép web vào app Android
        run: npx cap sync android

      - name: Lấy khóa ký app từ Secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > android/app/release.jks; echo "Ký bằng khóa BV TLS"; else echo "Chưa có khóa, ký bằng khóa debug"; fi

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/DiemDanh-BVTLS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DiemDanh-BVTLS-apk
          path: dist/DiemDanh-BVTLS.apk

      - name: Phát hành bản tải về (khi gắn tag v...)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DiemDanh-BVTLS.apk
          name: Điểm danh ${{ github.ref_name }} – BV TLS
          body: App Android Điểm danh. Từ BV TLS – by Dr Huy - BV TLS.
