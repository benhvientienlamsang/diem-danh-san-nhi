# Build app Android "Điểm danh" – Từ BV TLS – by Dr Huy - BV TLS
name: Build APK Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cài thư viện
        run: npm ci

      - name: Chép web vào app Android
        run: npx cap sync android

      - name: Lấy và kiểm tra khóa ký app
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          clean() { printf '%s' "$1" | tr -d '\r\n' | sed 's/^[[:space:]=]*//; s/[[:space:]]*$//'; }
          if [ -z "$KS" ]; then echo "::error::Chưa có secret ANDROID_KEYSTORE_BASE64"; exit 1; fi
          if ! printf '%s' "$KS" | tr -d '[:space:]' | base64 -d > android/app/release.jks 2>/dev/null; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 không đúng. Dán lại TOÀN BỘ nội dung file ANDROID_KEYSTORE_BASE64.txt"; exit 1; fi
          # Khóa BV TLS được tạo với mật khẩu khóa = mật khẩu kho, nên chỉ cần 1 mật khẩu
          PW=$(clean "$KSP"); AL=$(clean "$KA"); KPW="$PW"
          [ -z "$AL" ] && AL=bvtls
          echo "::add-mask::$PW"
          if ! keytool -list -keystore android/app/release.jks -storepass "$PW" > /dev/null 2>&1; then
            echo "::error::Secret ANDROID_KEYSTORE_PASSWORD sai, hoặc ANDROID_KEYSTORE_BASE64 bị thiếu ký tự. Dán lại mật khẩu trong DOC_KY.txt (chỉ phần sau dấu =, không có khoảng trắng)"; exit 1; fi
          if ! keytool -list -keystore android/app/release.jks -storepass "$PW" -alias "$AL" > /dev/null 2>&1; then
            echo "::error::Secret ANDROID_KEY_ALIAS sai, phải là: bvtls"; exit 1; fi
          {
            echo "KEYSTORE_PASSWORD=$PW"
            echo "KEY_ALIAS=$AL"
            echo "KEY_PASSWORD=$KPW"
          } >> "$GITHUB_ENV"
          echo "::notice::Khóa ký app BV TLS hợp lệ"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease || { echo "::error::Build APK lỗi, xem log bước Build APK"; exit 1; }
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/DiemDanh-BVTLS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DiemDanh-BVTLS-apk
          path: dist/DiemDanh-BVTLS.apk

      - name: Lấy số phiên bản app
        run: echo "APP_VERSION=$(grep -oP 'versionName \"\K[^\"]+' android/app/build.gradle)" >> "$GITHUB_ENV"

      - name: Phát hành bản tải về (tự động mỗi lần cập nhật nhánh main hoặc gắn tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.APP_VERSION) }}
          target_commitish: ${{ github.sha }}
          name: Điểm danh ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.APP_VERSION) }} – BV TLS
          body: App Android Điểm danh. Từ BV TLS – by Dr Huy - BV TLS.
          make_latest: true
          files: dist/DiemDanh-BVTLS.apk
